<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}{{ description | default('Asteria Studio is a polished Python-powered website built with Flask, responsive design, and local visual assets.') }}{% endblock %}">
    <meta name="robots" content="{{ robots | default('index, follow') }}">
    <meta name="theme-color" content="#f6f8f3">
    <title>{% block title %}{{ title | default('Asteria Studio') }}{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="alternate" type="application/rss+xml" title="Asteria Studio Journal" href="{{ url_for('journal_feed') }}">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("asteria-theme");
          var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body class="page-{{ page_class | default('interior') }}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Asteria Studio home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Asteria Studio</span>
      </a>
      <div class="header-tools">
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
          <span class="sr-only" data-theme-label>Use dark theme</span>
          <span class="theme-toggle-orb" aria-hidden="true"></span>
        </button>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="sr-only">Open navigation</span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
      </div>
      <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
        <a href="{{ url_for('work_index') }}">Work</a>
        <a href="{{ url_for('journal_index') }}">Journal</a>
        <a href="{{ url_for('about') }}">About</a>
        <a class="nav-action" href="{{ url_for('contact_page') }}">Start</a>
      </nav>
    </header>

    <main id="main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <span>Asteria Studio</span>
      <nav aria-label="Footer">
        <a href="{{ url_for('work_index') }}">Work</a>
        <a href="{{ url_for('journal_index') }}">Journal</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('contact_page') }}">Contact</a>
      </nav>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </body>
</html>
