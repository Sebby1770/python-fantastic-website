apiVersion: apps/v1
kind: Deployment
metadata:
  name: asteria-studio
  labels:
    app: asteria-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asteria-studio
  template:
    metadata:
      labels:
        app: asteria-studio
    spec:
      containers:
        - name: web
          image: ghcr.io/sebby1770/asteria-studio:latest
          ports:
            - containerPort: 5000
          env:
            - name: TRUST_PROXY_HEADERS
              value: "true"
            - name: CONTACT_RATE_LIMIT
              value: "5"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: asteria-studio
spec:
  type: ClusterIP
  selector:
    app: asteria-studio
  ports:
    - name: http
      port: 80
      targetPort: 5000
