[project]
name = "asteria-studio"
version = "2.0.0"
description = "Asteria Studio — an editorial Flask website for a digital practice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sebastian Forbes" }]
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=23,<24",
    "markdown>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
